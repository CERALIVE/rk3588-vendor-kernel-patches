version: 2

# This repository ships patch text and shell/Python tooling that uses only the
# standard library, so `github-actions` is the entire dependency surface. There
# is deliberately no npm or cargo ecosystem here.
#
# The BSP kernel commit and the upstream patch commits are NOT dependabot-managed:
# all three are pinned by SHA in kernel-pin.env, and bumping any of them requires
# re-running the apply gate. `scripts/preflight.sh --head`, run weekly by the
# patch-apply workflow, is the drift watch for those — including the check for
# whether armbian/linux-rockchip PR #487 has merged, which is the signal to
# retire this repository rather than to bump it.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
